services:
  athena:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      ATHENA_DATA_DIR: /athena/data
      ATHENA_OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - athena_data:/athena/data
      - model_cache:/home/athena/.cache
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 6g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  athena_data:
  model_cache:
